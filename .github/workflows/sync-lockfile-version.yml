name: Sync package-lock version

on:
  push:
    branches:
      - feature/android-v0.19.0-gate-b

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/android-v0.19.0-gate-b
      - name: Update only project version fields
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (lock.version !== '0.19.2' || lock.packages?.['']?.version !== '0.19.2') {
            throw new Error('Unexpected package-lock root versions; refusing broad rewrite.');
          }
          lock.version = '0.19.3';
          lock.packages[''].version = '0.19.3';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit package-lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "chore: package-lock auf v0.19.3 synchronisieren"
          git push origin HEAD:feature/android-v0.19.0-gate-b
