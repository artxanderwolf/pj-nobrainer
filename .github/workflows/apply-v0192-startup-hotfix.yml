name: Apply v0.19.2 startup hotfix

on:
  push:
    branches:
      - feature/android-v0.19.0-gate-b
    paths:
      - .github/workflows/apply-v0192-startup-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v0.19.0-gate-b
          fetch-depth: 0

      - name: Apply targeted startup hotfix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s.endsWith('\n') ? s : s + '\n', 'utf8');
          const replaceOnce = (source, from, to, label) => {
            const index = source.indexOf(from);
            if (index < 0) throw new Error(`Pattern not found: ${label}`);
            if (source.indexOf(from, index + from.length) >= 0) throw new Error(`Pattern not unique: ${label}`);
            return source.slice(0, index) + to + source.slice(index + from.length);
          };

          // 1) Updater must not observe and mutate the full DOM recursively.
          const servicePath = 'src/app/core/game-update.service.ts';
          let service = read(servicePath);
          service = replaceOnce(service,
            '  private domObserver: MutationObserver | null = null;\n',
            '',
            'remove domObserver field');
          service = replaceOnce(service,
            "    this.stateSubject.next({ ...INITIAL_STATE, phase: 'idle' });\n    this.installPresentationObserver();\n    this.downloadListener = await AndroidUpdater.addListener('downloadProgress', event => this.onDownloadProgress(event));",
            "    this.stateSubject.next({ ...INITIAL_STATE, phase: 'idle' });\n    this.ensurePresentation();\n    this.downloadListener = await AndroidUpdater.addListener('downloadProgress', event => this.onDownloadProgress(event));",
            'initialize presentation without observer');
          service = replaceOnce(service,
            '  async destroy(): Promise<void> {\n    this.domObserver?.disconnect();\n    this.domObserver = null;\n    await this.downloadListener?.remove();\n    this.downloadListener = null;\n  }',
            '  async destroy(): Promise<void> {\n    await this.downloadListener?.remove();\n    this.downloadListener = null;\n  }',
            'destroy observer cleanup');
          service = replaceOnce(service,
            '  private installPresentationObserver(): void {\n    if (this.domObserver) return;\n    this.domObserver = new MutationObserver(() => this.ensurePresentation());\n    this.domObserver.observe(document.documentElement, { childList: true, subtree: true });\n    this.ensurePresentation();\n    this.stateSubject.subscribe(() => this.renderPresentation());\n  }\n\n',
            '',
            'remove recursive MutationObserver');
          write(servicePath, service);

          // 2) Start updater only after the game shell exists and after a first paint opportunity.
          write('src/main.ts', `import { bootstrapApplication } from '@angular/platform-browser';\nimport { AppComponent } from './app/app.component';\nimport { GameUpdateService } from './app/core/game-update.service';\n\nconst UPDATE_START_RETRY_MS = 50;\nconst UPDATE_START_MAX_ATTEMPTS = 200;\n\nfunction startUpdaterAfterGameRender(updateService: GameUpdateService, attempt = 0): void {\n  const gameShellReady = Boolean(document.querySelector('#index .grid'));\n  if (!gameShellReady) {\n    if (attempt >= UPDATE_START_MAX_ATTEMPTS) {\n      console.warn('Android-Updater wurde nicht gestartet, weil die Spieloberfläche nicht rechtzeitig bereit war. Das Spiel läuft ohne Updateprüfung weiter.');\n      return;\n    }\n    window.setTimeout(() => startUpdaterAfterGameRender(updateService, attempt + 1), UPDATE_START_RETRY_MS);\n    return;\n  }\n\n  window.requestAnimationFrame(() => {\n    window.setTimeout(() => {\n      void updateService.initialize().catch((error: unknown) => {\n        console.warn('Android-Updater konnte nicht initialisiert werden. Das Spiel läuft normal weiter.', error);\n      });\n    }, 0);\n  });\n}\n\nbootstrapApplication(AppComponent)\n  .then(appRef => {\n    startUpdaterAfterGameRender(appRef.injector.get(GameUpdateService));\n  })\n  .catch((error: unknown) => {\n    console.error('Smiths of Eldravar konnte nicht gestartet werden.', error);\n  });\n`);

          // 3) Version v0.19.2 / Android code 3. Save version deliberately unchanged.
          const textFiles = [
            'scripts/bootstrap-android.mjs',
            'scripts/check-android-base.mjs',
            'scripts/check-app-shell-presentation.mjs',
            'scripts/check-built-runtime-startup.mjs',
            'scripts/check-built-save-transfer.mjs',
            'src/app/game/app-shell-presentation-core.ts',
            'android/app/build.gradle'
          ];
          for (const path of textFiles) {
            let value = read(path).replaceAll('0.19.1', '0.19.2');
            if (path === 'scripts/bootstrap-android.mjs') value = value.replace('const ANDROID_VERSION_CODE = 2;', 'const ANDROID_VERSION_CODE = 3;');
            if (path === 'android/app/build.gradle') value = value.replace(/versionCode\s+2\b/, 'versionCode 3');
            if (path === 'scripts/check-android-base.mjs') {
              value = value.replace(/versionCode\\s\+2\\b/g, 'versionCode\\s+3\\b');
              value = value.replace('Android versionCode muss für den Gerätetest 2 sein.', 'Android versionCode muss für den Gerätetest 3 sein.');
            }
            write(path, value);
          }

          const packagePath = 'package.json';
          const pkg = JSON.parse(read(packagePath));
          pkg.version = '0.19.2';
          write(packagePath, JSON.stringify(pkg, null, 2));

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(read(lockPath));
          lock.version = '0.19.2';
          if (lock.packages?.['']) lock.packages[''].version = '0.19.2';
          write(lockPath, JSON.stringify(lock, null, 2));

          // 4) Structural regression: updater must never be a bootstrap blocker or recursive DOM observer.
          const updaterCheckPath = 'scripts/check-android-updater.mjs';
          let updaterCheck = read(updaterCheckPath);
          updaterCheck = replaceOnce(updaterCheck,
            "const service = read('src/app/core/game-update.service.ts');\nconst bridge = read('src/app/core/android-updater.plugin.ts');",
            "const service = read('src/app/core/game-update.service.ts');\nconst main = read('src/main.ts');\nconst bridge = read('src/app/core/android-updater.plugin.ts');",
            'load main startup for updater check');
          updaterCheck = replaceOnce(updaterCheck,
            "assert.match(service, /Später/);\n",
            "assert.match(service, /Später/);\nassert.doesNotMatch(service, /MutationObserver|domObserver|installPresentationObserver/, 'Updater darf den gesamten DOM nicht rekursiv beobachten.');\nassert.match(main, /document\\.querySelector\\('#index \\.grid'\\)/, 'Updater darf erst starten, wenn die Spieloberfläche vorhanden ist.');\nassert.match(main, /requestAnimationFrame/, 'Vor Updater-Initialisierung muss ein Paint-Zeitfenster möglich sein.');\nassert.match(main, /setTimeout/, 'Updater-Initialisierung muss in einen nachgelagerten Task verschoben werden.');\nassert.match(main, /updateService\\.initialize\\(\\)\\.catch/, 'Updaterfehler müssen vom Spielstart isoliert bleiben.');\n",
            'add startup isolation assertions');
          write(updaterCheckPath, updaterCheck);

          let releaseDoc = read('ANDROID_RELEASE.md');
          releaseDoc = releaseDoc.replace('- App-Version: 0.19.1; Save-Version bleibt 14.', '- App-Version: 0.19.2; Save-Version bleibt 14.');
          releaseDoc = releaseDoc.replace('- Android versionCode bleibt 2 für den Gate-B-Gerätetest; ein Remote-Update bleibt bis Gate C geschlossen.', '- Android versionCode ist 3 für den Gate-B-Gerätetest; ein Remote-Update bleibt bis Gate C geschlossen.');
          releaseDoc += `\n### Gate-B-Startup-Hotfix v0.19.2\n\n- Ursache gegenüber dem funktionierenden Gate-A-Stand eingegrenzt: Der Gate-B-Updater beobachtete den gesamten DOM und mutierte ihn aus demselben Observer heraus.\n- Der globale MutationObserver ist entfernt.\n- Die Spieloberfläche wird vollständig aufgebaut; erst danach und nach einem möglichen ersten Paint wird der Updater initialisiert.\n- Kann der Updater nicht starten, läuft das Spiel ohne Updateprüfung weiter.\n- Save-Version bleibt 14; Gameplay und Balancing bleiben unverändert.\n`;
          write('ANDROID_RELEASE.md', releaseDoc);

          // Hard guard: no stale current-version marker in executable/test config.
          for (const path of ['package.json','package-lock.json','scripts/bootstrap-android.mjs','scripts/check-android-base.mjs','scripts/check-app-shell-presentation.mjs','scripts/check-built-runtime-startup.mjs','scripts/check-built-save-transfer.mjs','src/app/game/app-shell-presentation-core.ts','android/app/build.gradle']) {
            if (read(path).includes('0.19.1')) throw new Error(`Stale 0.19.1 marker in ${path}`);
          }
          if (!read('src/app/game/save-codec.ts').includes('export const SAVE_VERSION = 14;')) throw new Error('Save version changed unexpectedly');
          NODE

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "artxanderwolf"
          git config user.email "artxanderwolf@gmail.com"
          git add src/main.ts src/app/core/game-update.service.ts src/app/game/app-shell-presentation-core.ts scripts/bootstrap-android.mjs scripts/check-android-base.mjs scripts/check-android-updater.mjs scripts/check-app-shell-presentation.mjs scripts/check-built-runtime-startup.mjs scripts/check-built-save-transfer.mjs android/app/build.gradle package.json package-lock.json ANDROID_RELEASE.md
          git diff --cached --check
          git commit -m "v0.19.2: Android-Startup vom Updater entkoppeln"
          git push origin HEAD:feature/android-v0.19.0-gate-b
