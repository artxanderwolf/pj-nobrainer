name: GitHub Pages

on:
  push:
    branches:
      - migration/angular
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular app for GitHub Pages
        run: npm run build:pages

      - name: Smoke test built runtime
        run: node scripts/check-built-runtime-startup.mjs

      - name: Verify Android update channel
        run: test -f dist/nobrainer/browser/android-update/stable.json && node --no-warnings --experimental-strip-types scripts/check-update-core.mjs

      - name: Test forge selection in browser
        run: node scripts/check-built-forge-selection.mjs

      - name: Test market quantity input in browser
        run: node scripts/check-built-market-quantity-input.mjs

      - name: Test Dungeon loot collection in browser
        run: node scripts/check-built-dungeon-loot-collect.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nobrainer/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
