name: Gate B Startup Hotfix Migration

on:
  push:
    branches:
      - feature/android-v0.19.0-gate-b
    paths:
      - scripts/apply-gate-b-startup-hotfix.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0

      - name: Apply startup hotfix
        run: node scripts/apply-gate-b-startup-hotfix.mjs

      - name: Normalize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit hotfix state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "v0.19.1: Offline-Zusammenfassung erst nach Erst-Render anzeigen"
          git push
