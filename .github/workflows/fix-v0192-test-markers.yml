name: Fix v0.19.2 test markers

on:
  push:
    branches:
      - feature/android-v0.19.0-gate-b
    paths:
      - .github/workflows/fix-v0192-test-markers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v0.19.0-gate-b
          fetch-depth: 0
      - name: Fix escaped version assertions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const scriptsDir = 'scripts';
          for (const name of fs.readdirSync(scriptsDir)) {
            if (!name.endsWith('.mjs')) continue;
            const file = path.join(scriptsDir, name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('0\\.19\\.1', '0\\.19\\.2');
            source = source.replaceAll('v0\\.19\\.1-', 'v0\\.19\\.2-');
            source = source.replace('Android versionCode muss für die v0.19.2-Gerätetestversion 2 sein.', 'Android versionCode muss für die v0.19.2-Gerätetestversion 3 sein.');
            fs.writeFileSync(file, source, 'utf8');
          }
          const stale = [];
          for (const name of fs.readdirSync(scriptsDir)) {
            if (!name.endsWith('.mjs')) continue;
            const file = path.join(scriptsDir, name);
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes('0\\.19\\.1')) stale.push(file);
          }
          if (stale.length) throw new Error(`Stale escaped v0.19.1 markers: ${stale.join(', ')}`);
          NODE
      - name: Commit test fixes
        shell: bash
        run: |
          git config user.name "artxanderwolf"
          git config user.email "artxanderwolf@gmail.com"
          git add scripts
          git diff --cached --check
          git commit -m "v0.19.2: Versionsprüfungen synchronisieren"
          git push origin HEAD:feature/android-v0.19.0-gate-b
