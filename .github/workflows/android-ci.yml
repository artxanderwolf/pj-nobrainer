name: Android CI

on:
  push:
    branches:
      - feature/android-v0.18.0-gate-a
      - migration/angular
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply Gate A Android configuration
        run: node scripts/bootstrap-android-gate-a.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular app for Android
        run: npm run build:android:web

      - name: Create Android project when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Apply native Android release configuration
        run: node scripts/bootstrap-android-gate-a.mjs

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Verify Android base
        run: npm run check:android-base

      - name: Build debug and unsigned release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Build normal web app
        run: npm run build

      - name: Smoke test built runtime
        run: node scripts/check-built-runtime-startup.mjs

      - name: Test weapon image pilot in browser
        run: node --no-warnings --experimental-strip-types scripts/check-built-weapon-image-pilot.mjs

      - name: Test shared weapon card images in browser
        run: node scripts/check-built-shared-weapon-card-images.mjs

      - name: Test roster in browser
        run: node scripts/check-built-roster.mjs

      - name: Test recruitment modal in browser
        run: node scripts/check-built-tavern-modal.mjs

      - name: Test forge selection in browser
        run: node scripts/check-built-forge-selection.mjs

      - name: Test market quantity input in browser
        run: node scripts/check-built-market-quantity-input.mjs

      - name: Test market weapon images in browser
        run: node scripts/check-built-market-weapon-images.mjs

      - name: Test Dungeon loot collection in browser
        run: node scripts/check-built-dungeon-loot-collect.mjs

      - name: Test Trainingslager popup lifecycle in browser
        run: node scripts/check-built-dungeon-modal.mjs

      - name: Test Trainingslager resume across browser restart
        run: node scripts/check-built-dungeon-resume.mjs

      - name: Test save JSON export and import in browser
        run: node scripts/check-built-save-transfer.mjs

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smiths-of-eldravar-v0.18.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: smiths-of-eldravar-v0.18.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Commit generated Android project
        if: github.ref == 'refs/heads/feature/android-v0.18.0-gate-a'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated Android changes to commit."
          else
            git commit -m "v0.18.0: Android-Grundprojekt für Gate A"
            git push
          fi
