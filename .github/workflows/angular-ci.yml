name: Angular CI

on:
  push:
    branches:
      - migration/angular
      - feature/material-storage-id-v01311
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check stale app version markers
        run: |
          if grep -R --line-number --fixed-strings "0.12.91" src scripts package.json; then
            echo "Stale v0.12.91 marker found."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular app
        run: npm run build

      - name: Smoke test built runtime
        run: node scripts/check-built-runtime-startup.mjs

      - name: Test forge selection in browser
        run: node scripts/check-built-forge-selection.mjs

      - name: Test market quantity input in browser
        run: node scripts/check-built-market-quantity-input.mjs

      - name: Test Dungeon loot collection in browser
        run: node scripts/check-built-dungeon-loot-collect.mjs
