name: Finalize class emblems v0.16.1

on:
  push:
    branches:
      - fix/large-class-emblems-v0.16.1-manual-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and place uploaded PNGs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct, shutil

          mapping = {
              'bogner_emblem_512_opt.png': 'src/class-emblems/archer-large-v0.16.1.png',
              'krieger_emblem_512_opt.png': 'src/class-emblems/fighter-large-v0.16.1.png',
              'rekrut_emblem_512_opt.png': 'src/class-emblems/recruit-large-v0.16.1.png',
              'scholar_emblem_512_opt.png': 'src/class-emblems/scholar-large-v0.16.1.png',
          }
          Path('src/class-emblems').mkdir(parents=True, exist_ok=True)
          for src_name, dst_name in mapping.items():
              src = Path(src_name)
              if not src.exists():
                  raise SystemExit(f'Fehlende Datei: {src_name}')
              data = src.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or len(data) < 24:
                  raise SystemExit(f'Ungueltige PNG-Datei: {src_name}')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (512, 512):
                  raise SystemExit(f'Falsche Abmessungen {src_name}: {width}x{height}')
              print(src_name, len(data), hashlib.sha256(data).hexdigest())
              shutil.copyfile(src, dst_name)
              src.unlink()
          PY

      - name: Apply v0.16.1 references and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          css = Path('src/character-selection-v0.16.0.css')
          text = css.read_text()
          for old, new in {
              './class-emblems/archer-large.png': './class-emblems/archer-large-v0.16.1.png',
              './class-emblems/fighter-large.png': './class-emblems/fighter-large-v0.16.1.png',
              './class-emblems/recruit-large.png': './class-emblems/recruit-large-v0.16.1.png',
              './class-emblems/scholar-large.png': './class-emblems/scholar-large-v0.16.1.png',
          }.items():
              if old not in text:
                  raise SystemExit(f'Alter Asset-Pfad fehlt: {old}')
              text = text.replace(old, new)
          css.write_text(text)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '0.16.0':
              raise SystemExit(f'Unerwartete Ausgangsversion: {pkg.get("version")}')
          pkg['version'] = '0.16.1'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          shell_path = Path('src/app/game/app-shell-presentation-core.ts')
          shell = shell_path.read_text()
          shell_path.write_text(shell.replace("export const APP_UI_VERSION = '0.16.0';", "export const APP_UI_VERSION = '0.16.1';", 1))

          check_path = Path('scripts/check-app-shell-presentation.mjs')
          check = check_path.read_text()
          check = check.replace("APP_UI_VERSION, '0.16.0'", "APP_UI_VERSION, '0.16.1'")
          check = check.replace('data-ui-version="0\\.16\\.0"', 'data-ui-version="0\\.16\\.1"')
          check = check.replace('NO BRAINER · v0\\.16\\.0', 'NO BRAINER · v0\\.16\\.1')
          check = check.replace('v0.16.0-Shell', 'v0.16.1-Shell')
          check = check.replace('nicht v0.16.0', 'nicht v0.16.1')
          check = check.replace('responsive UI v0.16.0 ', 'responsive UI v0.16.1 ')
          check_path.write_text(check)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install and test
        run: |
          npm install --global npm@11.6.0 --no-audit --no-fund
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          node scripts/check-built-runtime-startup.mjs
          node scripts/check-built-roster.mjs
          node scripts/check-built-tavern-modal.mjs

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          rm -f .github/workflows/stage-class-emblems-v0.16.1.yml
          rm -f .github/workflows/finalize-class-emblems-v0.16.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.16.1: große Klassenembleme repariert"
          git push
