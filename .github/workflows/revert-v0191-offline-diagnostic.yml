name: Revert v0.19.1 offline diagnostic

on:
  push:
    branches:
      - feature/android-v0.19.0-gate-b
    paths:
      - .github/workflows/revert-v0191-offline-diagnostic.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v0.19.0-gate-b
          fetch-depth: 0
      - name: Restore proven Gate-A runtime startup behavior
        shell: bash
        run: |
          set -euo pipefail
          git show c8d650867604a864912946f27760009882d0882f:src/app/core/game-runtime.service.ts > src/app/core/game-runtime.service.ts
          node <<'NODE'
          const fs = require('fs');
          const p = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          delete pkg.scripts['check:offline-startup'];
          pkg.scripts.check = pkg.scripts.check
            .replace(' && npm run check:offline-startup', '')
            .replace('npm run check:offline-startup && ', '');
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          const docPath = 'ANDROID_RELEASE.md';
          let doc = fs.readFileSync(docPath, 'utf8');
          doc = doc.replace(/\n### Gate-B-Startup-Hotfix v0\.19\.1[\s\S]*?(?=\n### Gate-B-Startup-Hotfix v0\.19\.2|$)/, '\n');
          doc = doc.replace('### Gate-B-Startup-Hotfix v0.19.2', '### Gate-B-Startup-Hotfix v0.19.2');
          doc += '\n- Der zwischenzeitliche v0.19.1-Umbau der Offline-Zusammenfassung wurde verworfen; die Runtime-Startlogik entspricht wieder dem auf dem Gerät bestätigten Gate-A-Stand.\n';
          fs.writeFileSync(docPath, doc.endsWith('\n') ? doc : doc + '\n');
          NODE
          rm -f scripts/check-offline-startup-order.mjs
          git diff --check
      - name: Commit focused rollback
        shell: bash
        run: |
          git config user.name "artxanderwolf"
          git config user.email "artxanderwolf@gmail.com"
          git add src/app/core/game-runtime.service.ts package.json package-lock.json ANDROID_RELEASE.md
          git rm -f --ignore-unmatch scripts/check-offline-startup-order.mjs
          git diff --cached --check
          git commit -m "v0.19.2: Gate-A-Runtime-Startverhalten wiederherstellen"
          git push origin HEAD:feature/android-v0.19.0-gate-b
