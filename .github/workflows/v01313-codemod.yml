name: v0.13.13 ID codemod

on:
  push:
    branches:
      - feature/complete-material-id-v01313

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/complete-material-id-v01313

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply ID codemod
        run: node scripts/apply-v01313-dungeon-id.mjs

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/core/game-dungeon.service.ts src/app/core/game-runtime.service.ts src/app/core/game-market.service.ts src/app/game/app-shell-presentation-core.ts src/app/game/save-codec.ts package.json
          git commit -m "feat: complete canonical material ID state migration"
          git push origin HEAD:feature/complete-material-id-v01313
