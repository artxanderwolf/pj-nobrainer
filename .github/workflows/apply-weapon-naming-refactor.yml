name: Apply weapon naming refactor

on:
  push:
    branches:
      - migration/angular
    paths:
      - .github/workflows/apply-weapon-naming-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected baseline
        run: |
          test "$(git rev-parse HEAD^)" = "f94e8244ddb0521d46a316c32e16b69ebe8b3480"
          test "$(git hash-object NoBrainer_GitHub_v0.12.2.html)" = "058d2980cfb9ab3957d64df7e66ef9e9f87e3e90"

      - name: Apply reviewed files
        env:
          PAYLOAD_B64: 
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 --decode | tar -xzf -

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run checks and build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/game/game-core.ts src/app/game/weapon-naming.ts src/app/game/save-codec.ts src/app/app.component.ts scripts/check-game-core.mjs scripts/check-weapon-naming.mjs scripts/check-save-codec.mjs package.json
          git diff --cached --check
          git commit -m "Refactor weapon naming to form and base material"
          git push
